<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Pravda Network Atlas</title>
<p>Redirecting to the <a href="./">Pravda Network Atlas</a>…</p>
<script>
(async () => {
	const view = new URLSearchParams(location.search).get("view");
	const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
	let hash = "";
	try {
		const meta = view && view !== "world" ? (await (await fetch("./res/json/pravda-all-domains.json")).json()).Meta[view] : null;
		if (meta) hash = "#" + slug(meta.label);
	} catch { /* fall back to the overview */ }
	location.replace("./" + hash);
})();
</script>
</html>
