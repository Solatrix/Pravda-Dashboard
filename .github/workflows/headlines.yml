# .github/workflows/headlines.yml — nightly headline collection for the Atlas.
# Fetches each domain's RSS feed from GitHub's machines and commits res/json/headlines.json.
name: Collect headlines
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      probe:
        description: "Only test which feed path works on a few domains (writes nothing)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe feed paths
        if: inputs.probe
        run: python tools/fetch_headlines.py res/json/pravda-all-domains.json --probe 4
      - if: ${{ !inputs.probe }}
        run: python tools/fetch_headlines.py res/json/pravda-all-domains.json res/json/headlines.json --per-domain 10 --archive
      - name: Commit if changed
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "headlines-bot"
          git config user.email "headlines-bot@users.noreply.github.com"
          git add res/json/headlines.json
          git diff --cached --quiet && exit 0
          git commit -m "Update headlines"
          git pull --rebase && git push
