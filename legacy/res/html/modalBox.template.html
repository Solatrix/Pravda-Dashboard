<div class="overlay-popup">
	<div class="close-button">

			height="10" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
			<defs id="defs11" />
			<g id="glyph" transform="translate(-51,-465)">
				<path
					d="m 129,517 c 4,0 10,0 14,-5 L 380,265 617,512 c 4,5 10,5 14,5 6,0 11,-2 14,-5 l 58,-59 c 4,-4 6,-9 6,-14 0,-5 -2,-9 -6,-13 L 466,180 703,-66 c 4,-4 6,-8 6,-13 0,-5 -2,-10 -6,-14 l -58,-59 c -3,-3 -8,-5 -14,-5 -4,0 -10,0 -14,5 L 380,95 143,-152 c -4,-5 -10,-5 -14,-5 -6,0 -11,2 -14,5 l -58,59 c -4,4 -6,9 -6,14 0,5 2,9 6,13 L 294,180 57,426 c -4,4 -6,8 -6,13 0,5 2,10 6,14 l 58,59 c 3,3 8,5 14,5 z"
					id="path6" />

	</div>
	<div class="headline">
		<h3>{{feature}}</h3>
		<div>
			<a alt="View more details" class="domain" href="./details.html?view={{feature}}">
				{{domain}}
			</a>
		</div>
	</div>
	<div class="tabbed">
		<input type="radio" id="fact-sheet-tab" name="tabs" class="hidden" checked>
		<label for="fact-sheet-tab" class="tab header">
			Fact sheet
		</label>
		<input type="radio" id="metrics-tab" name="tabs" class="hidden">
		<label for="metrics-tab" class="tab header">
			Metrics
		</label>
		<div id="fact-sheet" class="tab-content hidden">
			{{fact-sheet}}
		</div>
		<div id="metrics" class="tab-content">
			<div class="container graph-container-small" data-feature-name="{{feature}}">
				<article>
					<div class="header">Most frequent sources</div>
					<div id="top-sources-chart"></div>
				</article>

				<article>
					<div class="header">
						Posting frequency over time
					</div>
					<div id="frequency-chart">
					</div>
				</article>

				<article>
					<div class="header">Publications per hour</div>
					<div id="hourly-chart"></div>
				</article>
				<article>
					<div class="header">Categories</div>
					<div id="category-chart"></div>
				</article>
			</div>
		</div>
	</div>

	<div class="loader_container">
		<div class="merge"></div>
	</div>
</div>
