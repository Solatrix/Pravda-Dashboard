<div class="slideshow">
    <div class="row slide-element active">
        <div id="square">
            <h4 class="figure">{{rank}}
            </h4>
            <p class="caption">most affected region by Pravda Network</p>
        </div>
        <div class="">
            <p class="">Pravda Network has targeted {{feature}} with {{figure}} articles across {{domains}}
                website(s)
            </p>
            <div class="domain-list">
                {{domain-list}}
            </div>
        </div>
    </div>
    <div class="slide-element circle-pack-graph">
        <article>
            <svg class="circle-pack" style="height: 500px; width:500px;">
                <g></g>
            </svg>
        </article>
        <p class="small-caption">The top influencers targeting {{feature}} include {{x}} Russian media outlets and {{y}} Telegram channels</p>
    </div>
    <div class="slide-element">

    </div>
</div>
<div class="arrow-controls">
    <a href="#" class="arrow-left disable" onClick="slideLeft()">
    </a>
    <a href="#" class="arrow-right" onClick="slideRight()"></a>
</div>
