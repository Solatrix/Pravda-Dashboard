<div class="arrow-controls">
    <a href="#" class="arrow-left disable" onClick="slideLeft()">
    </a>
    <a href="#" class="arrow-right" onClick="slideRight()"></a>
</div>
<div class="slideshow">
    <div class=" slide-element active">
        <div class="header-title">
            <h5>RANK</h5>
        </div>
        <div class="row">
            <div id="square">
                <h4 class="figure">{{rank}}
                </h4>
                <p class="caption">most affected region by Pravda Network</p>
            </div>
            <div class="">
                <p class="">Pravda Network has targeted {{feature}} with {{figure}} articles across {{domains}}
                    website(s)
                </p>
                <div class="domain-list">
                    {{domain-list}}
                </div>
            </div>
        </div>
       
    </div>
    <div class="slide-element">
        <div class="header-title">
            <h5>TOP INFLUENCERS</h5>
        </div>
        <div class="circle-pack-graph">
            <div class="col">
                <p class="small-caption tg-caption" data-count="{{y}}">Telegram channels</p>
                <p class="small-caption web-caption" data-count="{{x}}">Media outlets</p>
            </div>
            <article>
                <svg class="circle-pack" style="height: 500px; width:500px;">
                    <g></g>
                </svg>
            </article>
 
        </div>
        
    </div>
    <div class="slide-element">
        <div class="header-title">
            <h5>ACTIVITY</h5>
        </div>
    </div>
</div>
