<div class="overlay-popup">
	<div class="close-button">🗙</div>
	<div class="headline">
		<h3>{{feature}}</h3>
		<div>
			<a alt="View more details" class="domain" href="./details.html?view={{feature}}">
				{{domain}}
			</a>
		</div>
	</div>
	<div class="tabbed">
		<!-- <input type="radio" id="fact-sheet-tab" name="tabs" class="hidden" checked>
		<label for="fact-sheet-tab" class="tab header">
			Fact sheet
		</label> -->
		<input type="radio" id="metrics-tab" name="tabs" class="hidden" checked>
		<label for="metrics-tab" class="tab header">
			Metrics
		</label>
		<!-- <div id="fact-sheet" class="tab-content"></div> -->
		<div id="metrics" class="tab-content">
			<div class="container graph-container-small" data-feature-name="{{feature}}">
				<article>
					<div class="header">Most frequent sources</div>
					<div id="top-sources-chart"></div>
				</article>
		
				<article>
					<div class="header">
						Posting frequency over time
					</div>
					<div id="frequency-chart">
					</div>
				</article>
		
				<article>
					<div class="header">Publications per hour</div>
					<div id="hourly-chart"></div>
				</article>
				<article>
					<div class="header">Categories</div>
					<div id="category-chart"></div>
				</article>
			</div>
		</div>
	</div>
	
	<div class="loader_container">
		<div class="merge"></div>
	</div>
</div>
